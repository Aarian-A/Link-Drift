<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontier Service Probability Tool</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="url(#gradient)"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" style="stop-color:#E31837"/>
                            <stop offset="100%" style="stop-color:#B91429"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>Frontier Service Probability Tool</h1>
            </div>
            <p class="subtitle">Check service availability and quality for any address</p>
        </header>

        <main>
            <div class="search-section">
                <div class="search-card">
                    <h2>Enter Address Details</h2>
                    <form id="addressForm">
                        <div class="form-group">
                            <label for="streetAddress">Street Address</label>
                            <input type="text" id="streetAddress" name="streetAddress" placeholder="e.g., 1234 Main Street" required>
                            <span class="error-message" id="streetAddressError"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" name="city" placeholder="e.g., Dallas" required>
                                <span class="error-message" id="cityError"></span>
                            </div>

                            <div class="form-group">
                                <label for="state">State</label>
                                <select id="state" name="state" required>
                                    <option value="">Select State</option>
                                    <option value="TX">Texas (TX)</option>
                                    <option value="CA">California (CA)</option>
                                    <option value="FL">Florida (FL)</option>
                                    <option value="NY">New York (NY)</option>
                                    <option value="WA">Washington (WA)</option>
                                    <option value="IL">Illinois (IL)</option>
                                </select>
                                <span class="error-message" id="stateError"></span>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="zipCode">ZIP Code</label>
                                <input type="text" id="zipCode" name="zipCode" placeholder="e.g., 75201" required maxlength="10">
                                <span class="error-message" id="zipCodeError"></span>
                            </div>

                            <div class="form-group">
                                <label for="addressType">Address Type</label>
                                <select id="addressType" name="addressType" required>
                                    <option value="">Select Type</option>
                                    <option value="Single-Family">Single-Family</option>
                                    <option value="Multi-Dwelling">Multi-Dwelling</option>
                                    <option value="Commercial">Commercial</option>
                                </select>
                                <span class="error-message" id="addressTypeError"></span>
                            </div>
                        </div>

                        <div class="button-group">
                            <button type="submit" class="btn btn-primary">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                Check Serviceability
                            </button>
                            <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="results-header">
                    <h2>Serviceability Results</h2>
                    <span class="status-badge" id="statusBadge"></span>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="card-icon" style="background: linear-gradient(135deg, #E31837 0%, #B91429 100%);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h3>Technology & Speed</h3>
                        <div class="result-content" id="technologyInfo"></div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="3" width="18" height="18" rx="2" stroke="white" stroke-width="2"/>
                                <path d="M9 11l3 3L22 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h3>Network Quality</h3>
                        <div class="result-content" id="qualityInfo"></div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2"/>
                                <path d="M12 6v6l4 2" stroke="white" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <h3>Service Reliability</h3>
                        <div class="result-content" id="reliabilityInfo"></div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h3>Market Intelligence</h3>
                        <div class="result-content" id="marketInfo"></div>
                    </div>
                </div>

                <div class="recommendation-section">
                    <div class="recommendation-card" id="recommendationCard"></div>
                </div>

                <div class="detailed-metrics">
                    <h3>Detailed Metrics</h3>
                    <div class="metrics-grid" id="detailedMetrics"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Link Drift. All rights reserved.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
